<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tableau de bord financier</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finances YC">
<meta name="theme-color" content="#1a56a8">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 background:#f6f7f9;color:#1c2733;display:flex;min-height:100vh;align-items:center;justify-content:center}
@media (prefers-color-scheme: dark){body{background:#12171d;color:#e6ebf0}}
.box{max-width:340px;width:90%;text-align:center;padding:28px}
.logo{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;display:block}
h1{font-size:19px;margin:0 0 6px}
p{font-size:13.5px;opacity:0.65;margin:0 0 22px;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border:1.5px solid #c8d0d8;
 border-radius:10px;background:transparent;color:inherit;outline:none;text-align:center}
input:focus{border-color:#1a56a8}
button{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;border:none;
 border-radius:10px;background:#1a56a8;color:#fff;cursor:pointer}
button:disabled{opacity:0.5}
.err{color:#c53030;font-size:13px;margin-top:12px;min-height:18px}
.small{font-size:11.5px;opacity:0.45;margin-top:26px}
</style>
</head>
<body>
<div class="box">
  <img src="icon-192.png" class="logo" alt="">
  <h1>Tableau de bord financier</h1>
  <p>Les données sont chiffrées. Saisis ton mot de passe pour les déverrouiller sur cet appareil.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Déverrouiller</button>
  </form>
  <div class="err" id="err"></div>
  <div class="small" id="ver">Le déchiffrement se fait entièrement sur ton appareil — rien n'est envoyé nulle part.</div>
</div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const enc = s => new TextEncoder().encode(s);
async function decrypt(pw, buf){
  const bytes = new Uint8Array(buf);
  const salt = bytes.slice(0,16), iv = bytes.slice(16,28), ct = bytes.slice(28);
  const km = await crypto.subtle.importKey('raw', enc(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:300000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function open(pw){
  const err = document.getElementById('err'), go = document.getElementById('go');
  go.disabled = true; err.textContent = '';
  try{
    const r = await fetch('data.enc', {cache:'no-cache'});
    if(!r.ok) throw new Error('Les données ne sont pas encore publiées.');
    const html = await decrypt(pw, await r.arrayBuffer());
    document.open(); document.write(html); document.close();
  }catch(e){
    go.disabled = false;
    err.textContent = e.name==='OperationError' ? 'Mot de passe incorrect.' : (e.message||'Erreur de chargement.');
  }
}
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if(pw) open(pw);
});
// Le mot de passe n'est jamais conserve : ni sessionStorage, ni localStorage, ni cookie.
// Purge d'une eventuelle valeur laissee par une version anterieure de l'appli.
try { sessionStorage.removeItem('k'); localStorage.removeItem('k'); } catch(e) {}
</script>
</body>
</html>
